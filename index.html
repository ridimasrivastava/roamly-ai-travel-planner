<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ROAMLY — Plan less. Roam more.</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navigation Bar -->

    <nav class="navbar">

        <div class="logo">
            ✈️ ROAMLY
        </div>

        <div class="nav-links">

            <a href="#">Home</a>
            <a href="#">Explore</a>
            <a href="#">My Trips</a>

        </div>

    </nav>


    <!-- Main Section -->

    <main>

        <section class="hero">

            <h1>
                Plan less.<br>
                Roam more.
            </h1>

            <p>
                Your AI-powered travel companion for smarter routes,
                stays, budgets and unforgettable places.
            </p>


            <!-- Hero Visual -->

            <div class="hero-visual">

                <div class="orbit orbit-one"></div>

                <div class="orbit orbit-two"></div>

                <div class="travel-globe">
                    🌍
                </div>

                <div class="floating-icon plane">
                    ✈️
                </div>

                <div class="floating-icon location">
                    📍
                </div>

                <div class="floating-icon suitcase">
                    🧳
                </div>

            </div>


            <!-- Travel Planning Form -->

            <div class="planner-card">

                <h2>
                    Where will you go next?✨
                </h2>


                <!-- From -->

                <div class="form-group">

                    <label for="from">
                        From
                    </label>

                    <input
                        type="text"
                        id="from"
                        placeholder="Enter starting location"
                    >

                </div>


                <!-- Destination -->

                <div class="form-group">

                    <label for="destination">
                        Destination
                    </label>

                    <input
                        type="text"
                        id="destination"
                        placeholder="Enter destination"
                    >

                </div>


                <!-- Dates -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="start-date">
                            Start Date
                        </label>

                        <input
                            type="date"
                            id="start-date"
                        >

                    </div>


                    <div class="form-group">

                        <label for="end-date">
                            End Date
                        </label>

                        <input
                            type="date"
                            id="end-date"
                        >

                    </div>

                </div>


                <!-- Travelers + Budget Information -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="people">
                            Travelers
                        </label>

                        <input
                            type="number"
                            id="people"
                            min="1"
                            value="1"
                        >

                    </div>

                </div>

                <!-- Plan Button -->

                <button id="plan-button">

                    ✨ Plan My Trip

                </button>

            </div>

        </section>


        <!-- Results Section -->

        <section id="results" class="results">

            <h2>
                Your Travel Plan
            </h2>

            <div id="result-content">

                <p>
                    Your personalized itinerary will appear here.
                </p>

            </div>

        </section>

    </main>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
